name: Refresh Historical Price Data

on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: historical-price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh price history and derived data
        run: python -m src.refresh_price_history

      - name: Refresh XUT research pilot
        run: python -m src.etf_research

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- \
            "src/XST Historical Data (1).csv" \
            "src/XQQ Historical Data (1).csv" \
            src/delta_signals.csv \
            src/real_switches_asym_last5y.csv \
            src/real_switches_asym_last2y.csv \
            src/switch_signals_asym_last5y.png \
            src/switch_signals_asym_last2y.png \
            src/real_switches_asym_last5y.png \
            src/real_switches_asym_last2y.png \
            src/switch_duration_asym_last5y.png \
            src/historical_asymmetric_theory.docx \
            src/etf_research_XUT_TO_daily.csv \
            src/etf_research_XST_TO_daily.csv \
            src/etf_research_XQQ_TO_daily.csv \
            src/etf_research_XUT_TO_XQQ_TO_5y_3pct_curve.csv \
            src/etf_research_XUT_TO_XQQ_TO_5y_3pct_switches.csv \
            src/etf_research_XUT_TO_XQQ_TO_5y_5pct_curve.csv \
            src/etf_research_XUT_TO_XQQ_TO_5y_5pct_switches.csv \
            src/etf_research_XUT_TO_XQQ_TO_2y_3pct_curve.csv \
            src/etf_research_XUT_TO_XQQ_TO_2y_3pct_switches.csv \
            src/etf_research_XUT_TO_XQQ_TO_2y_5pct_curve.csv \
            src/etf_research_XUT_TO_XQQ_TO_2y_5pct_switches.csv \
            src/etf_research_XST_TO_XQQ_TO_5y_3pct_curve.csv \
            src/etf_research_XST_TO_XQQ_TO_5y_3pct_switches.csv \
            src/etf_research_XST_TO_XQQ_TO_5y_5pct_curve.csv \
            src/etf_research_XST_TO_XQQ_TO_5y_5pct_switches.csv \
            src/etf_research_XST_TO_XQQ_TO_2y_3pct_curve.csv \
            src/etf_research_XST_TO_XQQ_TO_2y_3pct_switches.csv \
            src/etf_research_XST_TO_XQQ_TO_2y_5pct_curve.csv \
            src/etf_research_XST_TO_XQQ_TO_2y_5pct_switches.csv \
            src/etf_research_summary.csv \
            src/etf_research_manifest.json \
            docs/etf_replacement_research.md
          if git diff --cached --quiet; then
            echo "No updated data to commit."
          else
            git commit -m "chore: refresh historical price data [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                exit 0
              fi
              if [ "$attempt" -lt 5 ]; then
                git fetch origin main
                git rebase origin/main
              fi
            done
            echo "Failed to push historical data after 5 attempts." >&2
            exit 1
          fi