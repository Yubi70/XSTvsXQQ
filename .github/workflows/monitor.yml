name: Price Monitor

on:
  schedule:
    # Every 30 min, 13:00-21:00 UTC, Mon-Fri — covers 9:30-16:00 ET across both
    # EDT and EST. Live checks use the Toronto exchange calendar; daily
    # Open/Close recovery also runs outside the live trading window.
    - cron: "*/30 13-21 * * 1-5"
    # Late retry for closing prices that Yahoo publishes after the session.
    - cron: "15 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: price-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price check
        id: collect
        env:
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
          START_HOLDING: ${{ secrets.START_HOLDING }}
          LAST_SWITCH_COST_XST: ${{ secrets.LAST_SWITCH_COST_XST }}
          LAST_SWITCH_COST_XQQ: ${{ secrets.LAST_SWITCH_COST_XQQ }}
        run: python -m src.monitor --once

      - name: Record session opening and closing prices
        if: ${{ !cancelled() && steps.collect.outcome != 'skipped' }}
        run: python -m src.monitor --session-boundaries

      - name: Commit and push updated logs
        if: ${{ !cancelled() && steps.collect.outcome != 'skipped' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- src/monitor_log.csv
          if [ -f src/position_state.json ]; then
            git add -f -- src/position_state.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: update monitor log [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi
